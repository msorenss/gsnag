[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs", "event"] }
gsnag-core = { path = "crates/gsnag-core" }
gsnag-proto = { path = "crates/gsnag-proto" }
gsnag-overlay = { path = "crates/gsnag-overlay" }
gtk4 = { version = "0.10", features = ["v4_12"] }
gtk4-layer-shell = "0.7"
gsnag-editor = { path = "crates/gsnag-editor" }
libadwaita = { version = "0.8", features = ["v1_5"] }
pangocairo = "0.21"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
gsnag-i18n = { path = "crates/gsnag-i18n" }
gsnag-record = { path = "crates/gsnag-record" }

# GTK's generated bindings are large; keep Pi development builds within memory.
# Override with CARGO_PROFILE_DEV_DEBUG=1 when source-level debugging is needed.
[profile.dev]
debug = 0

[patch.crates-io]
# Raspberry Pi FFmpeg adds pixel formats absent from the upstream Rust enum.
ffmpeg-next = { path = "vendor/ffmpeg-next" }
